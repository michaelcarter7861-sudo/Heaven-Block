name: 🎮 Build HavenBlocks Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type'
        required: true
        default: 'release'
        type: choice
        options:
          - release
          - debug

jobs:
  build-android:
    name: 📦 Build Android App Bundle
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: ☕ Setup JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: 🤖 Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: 📲 Accept Android Licenses
        run: yes | sdkmanager --licenses || true

      - name: 🛠️ Install Android Build Tools
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: 📦 Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: 🔧 Install Game Dependencies
        run: npm install

      - name: 🎨 Prepare Game Icon, Splash and PWA Assets
        run: npm run prepare:assets

      - name: 🧪 Validate Release AdMob Secrets
        run: node scripts/verify-release-ads.mjs "${{ github.event.inputs.build_type || 'release' }}"
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
          ADMOB_REWARDED_AD_ID: ${{ secrets.ADMOB_REWARDED_AD_ID }}

      - name: 🏗️ Build Web Bundle
        run: npm run build
        env:
          VITE_ADMOB_REWARDED_ID: ${{ github.event.inputs.build_type == 'debug' && 'ca-app-pub-3940256099942544/5224354917' || secrets.ADMOB_REWARDED_AD_ID }}
          # Optional public site used for “Play this same board” links in native builds.
          # Set a repository variable (not secret) named SHARE_BASE_URL, for example https://example.com.
          VITE_SHARE_BASE_URL: ${{ vars.SHARE_BASE_URL || '' }}

      - name: 📂 Initialize Capacitor Android
        run: npx cap add android
        env:
          CI: true

      - name: 📱 Generate Native Android Icon and Splash Resources
        run: npx capacitor-assets generate --android
      - name: 🌿 Apply HavenBlocks Launcher and Splash Theme
        run: node scripts/patch-android-branding.mjs

      - name: ⚙️ Set Android SDK Versions
        run: |
          if [ -f android/variables.gradle ]; then
            sed -i 's/minSdkVersion\s*=\s*[0-9]*/minSdkVersion = 24/' android/variables.gradle
            sed -i 's/compileSdkVersion\s*=\s*[0-9]*/compileSdkVersion = 36/' android/variables.gradle
            sed -i 's/targetSdkVersion\s*=\s*[0-9]*/targetSdkVersion = 36/' android/variables.gradle
          else
            cat > android/variables.gradle << 'EOF'
          ext {
              minSdkVersion = 24
              compileSdkVersion = 36
              targetSdkVersion = 36
              androidxActivityVersion = '1.9.0'
              androidxAppCompatVersion = '1.7.0'
              androidxCoordinatorLayoutVersion = '1.2.0'
              androidxCoreVersion = '1.13.1'
              androidxFragmentVersion = '1.8.2'
              junitVersion = '4.13.2'
              androidxJunitVersion = '1.2.1'
              androidxEspressoCoreVersion = '3.6.1'
              cordovaAndroidVersion = '10.0.0'
          }
          EOF
          fi

      - name: 🔢 Set Android version from workflow run
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path

          gradle_file = Path('android/app/build.gradle')
          if not gradle_file.exists():
              gradle_file = Path('android/app/build.gradle.kts')
          if not gradle_file.exists():
              raise SystemExit('Android app Gradle file was not generated')

          build_number = int(os.environ['BUILD_NUMBER'])
          lines = gradle_file.read_text().splitlines()
          code_updated = False
          name_updated = False
          for index, line in enumerate(lines):
              stripped = line.strip()
              indent = line[:len(line) - len(line.lstrip())]
              if not code_updated and stripped.startswith('versionCode'):
                  lines[index] = f'{indent}versionCode = {build_number}'
                  code_updated = True
              elif not name_updated and stripped.startswith('versionName'):
                  lines[index] = f'{indent}versionName = "1.0.{build_number}"'
                  name_updated = True
          if not code_updated or not name_updated:
              raise SystemExit('Could not safely update Android versionCode/versionName')
          gradle_file.write_text('\n'.join(lines) + '\n')
          print(f'Android versionCode={build_number}, versionName=1.0.{build_number}')
          PY
      - name: 💉 Inject AdMob App ID
        run: node scripts/patch-manifest.js
        env:
          ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}

      - name: 🔄 Sync Capacitor
        run: npx cap sync android

      - name: 💾 Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: 🐛 Build Debug APK
        if: github.event.inputs.build_type == 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 🔑 Decode Keystore
        if: github.event.inputs.build_type != 'debug'
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > android/app/release.keystore

      - name: 📦 Build Signed Release AAB
        if: github.event.inputs.build_type != 'debug'
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: 📤 Upload Debug APK
        if: github.event.inputs.build_type == 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: havenblocks-debug-${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7

      - name: 📦 Build Signed Release APK
        if: github.event.inputs.build_type != 'debug'
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon \
            -Pandroid.injected.signing.store.file=${{ github.workspace }}/android/app/release.keystore \
            -Pandroid.injected.signing.store.password=${{ secrets.KEYSTORE_PASSWORD }} \
            -Pandroid.injected.signing.key.alias=${{ secrets.KEY_ALIAS }} \
            -Pandroid.injected.signing.key.password=${{ secrets.KEY_PASSWORD }}

      - name: 📤 Upload Release APK
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: havenblocks-release-v${{ github.run_number }}.apk
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: 📤 Upload Release AAB
        if: github.event.inputs.build_type != 'debug'
        uses: actions/upload-artifact@v4
        with:
          name: havenblocks-release-v${{ github.run_number }}.aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
