name: 🔑 Generate Release Keystore

on:
  workflow_dispatch:
    inputs:
      key_alias:
        description: 'Key Alias'
        required: true
        default: 'havenblocks'
      store_password:
        description: 'Keystore Password'
        required: true
      key_password:
        description: 'Key Password'
        required: true

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: ☕ Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: 🔑 Generate Keystore
        run: |
          keytool -genkey -v \
            -keystore release.keystore \
            -alias "${{ github.event.inputs.key_alias }}" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "${{ github.event.inputs.store_password }}" \
            -keypass "${{ github.event.inputs.key_password }}" \
            -dname "CN=Muhammad Sabir, O=Real Loser Studio, C=PK" \
            -noprompt

      - name: 📋 Output Base64
        run: |
          KEYSTORE_B64=$(base64 -w 0 release.keystore)
          echo "## ✅ GitHub Secrets mein yeh add karo" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**KEYSTORE_BASE64** value:" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "$KEYSTORE_B64" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**KEY_ALIAS** = ${{ github.event.inputs.key_alias }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**KEYSTORE_PASSWORD** = (jo aapne diya)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**KEY_PASSWORD** = (jo aapne diya)" >> $GITHUB_STEP_SUMMARY
